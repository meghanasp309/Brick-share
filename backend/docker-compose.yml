# BrickShare database (PostgreSQL) and IPFS node (for property papers).
# Start:  docker compose up -d      Stop: docker compose stop
# Delete all data and start fresh: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    container_name: brickshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brickshare
      POSTGRES_PASSWORD: brickshare
      POSTGRES_DB: brickshare
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickshare"]
      interval: 5s
      retries: 10

  # IPFS: a peer-to-peer file network, a bit like torrents. Every file gets a
  # fingerprint (CID) made from its content, so a changed file gets a new CID.
  ipfs:
    image: ipfs/kubo:v0.38.1
    container_name: brickshare-ipfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001" # API: only the backend on this laptop may add files
      - "8080:8080"           # gateway: view a file at http://localhost:8080/ipfs/<CID>
    volumes:
      - ipfs-data:/data/ipfs

volumes:
  db-data:
  ipfs-data:
